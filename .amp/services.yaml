# Development servers for Amp orbs. Start them with `amp orb services ensure`.
services:
  api:
    command: uv run uvicorn beacon.main:app --host 127.0.0.1 --port "$PORT" --reload
    cwd: server
    port: 8000
    health: /api/health
    env:
      REPLAY: "1"
      # Whom a push service may write to about this development server: the
      # repository's page. Without a contact the server sends no notifications.
      BEACON_VAPID_SUBJECT: https://github.com/andrewtea/beacon
  web:
    command: pnpm dev --host 0.0.0.0 --port "$PORT" --strictPort
    cwd: web
    env:
      BEACON_API_URL: http://127.0.0.1:8000
    portal:
      title: Beacon
      description: The PWA dev server. It proxies /api to the FastAPI server.
